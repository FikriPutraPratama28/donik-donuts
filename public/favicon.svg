<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background hitam bulat -->
  <circle cx="50" cy="50" r="50" fill="#1a1a1a"/>
  <!-- Ring putih tipis -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Donut body kuning -->
  <ellipse cx="50" cy="46" rx="26" ry="22" fill="#f5c518"/>
  <!-- Donut glaze pink -->
  <ellipse cx="50" cy="42" rx="22" ry="16" fill="#f472b6"/>
  <!-- Glaze highlight putih -->
  <ellipse cx="44" cy="38" rx="7" ry="4" fill="rgba(255,255,255,0.35)" transform="rotate(-20 44 38)"/>
  <!-- Donut hole -->
  <circle cx="50" cy="46" rx="9" ry="9" fill="#1a1a1a"/>

  <!-- Sprinkles warna-warni -->
  <rect x="29" y="33" width="7" height="2.5" rx="1.25" fill="#22c55e"  transform="rotate(-35 29 33)"/>
  <rect x="62" y="30" width="7" height="2.5" rx="1.25" fill="#3b82f6"  transform="rotate(22 62 30)"/>
  <rect x="71" y="44" width="7" height="2.5" rx="1.25" fill="#fbbf24"  transform="rotate(-8 71 44)"/>
  <rect x="64" y="58" width="7" height="2.5" rx="1.25" fill="#a855f7"  transform="rotate(38 64 58)"/>
  <rect x="33" y="60" width="7" height="2.5" rx="1.25" fill="#ef4444"  transform="rotate(-22 33 60)"/>
  <rect x="24" y="46" width="7" height="2.5" rx="1.25" fill="#ec4899"  transform="rotate(12 24 46)"/>
  <rect x="44" y="26" width="6" height="2"   rx="1"    fill="#f97316"  transform="rotate(18 44 26)"/>
  <rect x="56" y="63" width="6" height="2"   rx="1"    fill="#6ee7b7"  transform="rotate(-25 56 63)"/>

  <!-- Titik-titik kecil di glaze -->
  <circle cx="45" cy="44" r="1.5" fill="rgba(139,0,60,0.6)"/>
  <circle cx="54" cy="40" r="1.2" fill="rgba(139,0,60,0.5)"/>
  <circle cx="58" cy="48" r="1"   fill="rgba(139,0,60,0.4)"/>

  <!-- Teks DONIK di bawah -->
  <text x="50" y="82" text-anchor="middle"
        font-family="Arial Black, sans-serif"
        font-weight="900" font-size="11"
        fill="#f472b6" letter-spacing="1">DONIK</text>
  <text x="50" y="92" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-weight="700" font-size="7"
        fill="rgba(255,255,255,0.5)" letter-spacing="0.5">DONUTS</text>
</svg>
